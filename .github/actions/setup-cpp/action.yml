name: Set up C++ checks
description: Install the pinned CAIL package and restore C++ build caches.
inputs:
  build-directory:
    description: Niminal CMake build directory for this job.
    required: true
runs:
  using: composite
  steps:
    - name: Install build and analysis tools
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends cmake ninja-build g++ libssl-dev python3-venv clang-format-20 clang-tidy-20 ccache
        python3 -m venv "$RUNNER_TEMP/cmake"
        "$RUNNER_TEMP/cmake/bin/python" -m pip install --disable-pip-version-check cmake==3.31.10
        echo "$RUNNER_TEMP/cmake/bin" >> "$GITHUB_PATH"
        # Ubuntu's default Clang cannot parse libstdc++'s C++23 <expected> header.
        for tool in clang-format clang-tidy run-clang-tidy; do
          sudo ln -sf "/usr/bin/${tool}-20" "/usr/local/bin/${tool}"
        done

    - name: Check out CAIL
      uses: actions/checkout@v4
      with:
        repository: martineastwood/cail
        ref: v0.3.0
        path: .ci/cail
        fetch-depth: 1

    - name: Read compiler version
      id: compiler
      shell: bash
      run: echo "gcc=$(g++ -dumpfullversion)" >> "$GITHUB_OUTPUT"

    - name: Restore C++ caches
      uses: actions/cache@v6
      with:
        path: |
          .cache/ccache
          .cache/cail-fetchcontent
          ${{ inputs.build-directory }}/_deps
        key: cpp-${{ runner.os }}-${{ steps.compiler.outputs.gcc }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', '.ci/cail/CMakeLists.txt') }}-${{ inputs.build-directory }}-${{ github.run_id }}
        restore-keys: |
          cpp-${{ runner.os }}-${{ steps.compiler.outputs.gcc }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', '.ci/cail/CMakeLists.txt') }}-${{ inputs.build-directory }}-

    - name: Configure and install CAIL
      shell: bash
      run: |
        mkdir -p .cache/ccache .cache/cail-fetchcontent
        CCACHE_DIR="$GITHUB_WORKSPACE/.cache/ccache" ccache --max-size=1G
        cmake -S .ci/cail -B "$RUNNER_TEMP/cail-build" -G Ninja \
          -DFETCHCONTENT_BASE_DIR="$GITHUB_WORKSPACE/.cache/cail-fetchcontent" \
          -DCAIL_BUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF
        cmake --build "$RUNNER_TEMP/cail-build" --parallel
        cmake --install "$RUNNER_TEMP/cail-build" --prefix "$RUNNER_TEMP/cail"
        echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/cail" >> "$GITHUB_ENV"
        echo "CCACHE_DIR=$GITHUB_WORKSPACE/.cache/ccache" >> "$GITHUB_ENV"
        echo "NIMINAL_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
        echo "NIMINAL_FETCHCONTENT_BASE_DIR=$GITHUB_WORKSPACE/${{ inputs.build-directory }}/_deps" >> "$GITHUB_ENV"
