[package]
name = "nimlive"
version.workspace = true
edition.workspace = true
description = "The niminal live sequencer: clips, scenes and patterns, driving a niminal daemon"

[[bin]]
name = "nimlive"
path = "src/main.rs"

[dependencies]
niminal-live = { path = "../live" }
niminal-lsp = { path = "../lsp" }
niminal-ws = { path = "../../crates/niminal-ws" }
niminal-engine = { path = "../../crates/niminal-engine" }
niminal-lang = { path = "../../crates/niminal-lang" }
niminal-compose = { path = "../compose" }
niminal-score = { path = "../../crates/niminal-score" }
niminal-daemon = { path = "../../crates/niminal-daemon" }
clap = { version = "4", features = ["derive"] }
hound = "3"
serde_json = "1"
midir = "0.11"

[dev-dependencies]
niminal-cli = { path = "../../crates/niminal-cli" }
rtrb = "0.3"
