name: Release binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New release tag, for example v0.1.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x86_64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: macos-15
            platform: macos
            arch: arm64
          - os: macos-15-intel
            platform: macos
            arch: x86_64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends cmake gcc g++ libssl-dev ninja-build python3-venv

      - name: Install CMake 3.31
        run: |
          python3 -m venv "$RUNNER_TEMP/cmake"
          "$RUNNER_TEMP/cmake/bin/python" -m pip install --disable-pip-version-check cmake==3.31.10
          echo "$RUNNER_TEMP/cmake/bin" >> "$GITHUB_PATH"

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install openssl@3

      - name: Check out CAIL
        uses: actions/checkout@v4
        with:
          repository: martineastwood/cail
          ref: v0.1.1
          path: .ci/cail
          fetch-depth: 1

      - name: Install CAIL
        run: |
          cmake -S .ci/cail -B "$RUNNER_TEMP/cail-build" -DCAIL_BUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/cail-build" --parallel
          cmake --install "$RUNNER_TEMP/cail-build" --prefix "$RUNNER_TEMP/cail"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/cail" >> "$GITHUB_ENV"

      - name: Configure Linux
        if: runner.os == 'Linux'
        # Ubuntu 24.04's GCC provides the C++23 library headers used by CAIL.
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_CXX_STANDARD=23
          -DCMAKE_CXX_STANDARD_REQUIRED=ON
          -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"

      - name: Configure macOS
        if: runner.os == 'macOS'
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_STANDARD=23
          -DCMAKE_CXX_STANDARD_REQUIRED=ON
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0

      - name: Show macOS compile flags
        if: runner.os == 'macOS'
        run: grep -m 1 'src/agent/chat.cpp' build/compile_commands.json

      - name: Build binary
        if: runner.os == 'Linux'
        run: cmake --build build --target niminal_cli --parallel

      - name: Build binary
        if: runner.os == 'macOS'
        run: cmake --build build --target niminal_cli --parallel

      - name: Package binary
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          ./build/niminal --version
          bundle="niminal-${PLATFORM}-${ARCH}"
          mkdir -p "dist/${bundle}"
          cp build/niminal "dist/${bundle}/niminal"
          tar -C dist -czf "dist/${bundle}.tar.gz" "${bundle}"
          shasum -a 256 "dist/${bundle}.tar.gz" > "dist/${bundle}.tar.gz.sha256"

          if [[ "$RUNNER_OS" == "Linux" ]]; then
            ldd build/niminal
          else
            otool -L build/niminal
          fi

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: niminal-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          pattern: niminal-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
