[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["sequencer"]

[workspace.package]
version = "0.0.1"
license = "MIT"
edition = "2024"

[profile.release]
lto = false

[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 1

# Full debuginfo made target/debug tens of GB; line tables keep backtraces readable.
[profile.dev]
debug = "line-tables-only"
