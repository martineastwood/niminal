[package]
name = "niminal-sequencer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The niminal live sequencer: clips, scenes, quantized changes and keyboards, driving the engine through its public event API"

[lints]
workspace = true

# `native` is everything that needs an operating system: MIDI in and out, the WebSocket service and the
# threads they run on. Without it the sequencer is `Live` and `Offline` only, which is what builds for the web.
[features]
default = ["native"]
native = ["dep:niminal-ws", "dep:midir"]

[dependencies]
niminal-ws = { path = "../niminal-ws", optional = true }
niminal-pattern = { path = "../niminal-pattern" }
niminal-engine = { path = "../niminal-engine" }
niminal-lang = { path = "../niminal-lang" }
niminal-compose = { path = "../niminal-compose" }
niminal-score = { path = "../niminal-score" }
niminal-server = { path = "../niminal-server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midir = { version = "0.11", optional = true }

[dev-dependencies]
hound = "3"
rtrb = "0.3"
