[package]
name = "niminal-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The niminal command: the engine as a server, offline rendering, and the language server"

[[bin]]
name = "niminal"
path = "src/main.rs"

[dependencies]
niminal-sequencer = { path = "../niminal-sequencer" }
niminal-host = { path = "../niminal-host" }
niminal-lsp = { path = "../niminal-lsp" }
niminal-ws = { path = "../niminal-ws" }
niminal-engine = { path = "../niminal-engine" }
niminal-lang = { path = "../niminal-lang" }
niminal-compose = { path = "../niminal-compose" }
niminal-score = { path = "../niminal-score" }
niminal-server = { path = "../niminal-server" }
clap = { version = "4", features = ["derive"] }
hound = "3"
serde_json = "1"

[dev-dependencies]
rtrb = "0.3"
