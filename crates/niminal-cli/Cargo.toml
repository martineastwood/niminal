[package]
name = "niminal-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The niminal command line: the audio server, the language server and offline tools"

[[bin]]
name = "niminal"
path = "src/main.rs"

[dependencies]
niminal-engine = { path = "../niminal-engine" }
niminal-lang = { path = "../niminal-lang" }
clap = { version = "4", features = ["derive"] }
hound = "3"
niminal-server = { path = "../niminal-server" }
niminal-ws = { path = "../niminal-ws" }
cpal = "0.18"
serde_json = "1"
rtrb = "0.3"
midir = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
niminal-score = { path = "../niminal-score" }
