name: macOS alpha package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Alpha version (for example 0.0.1-alpha.1)'
        required: true
        type: string
  push:
    tags: ['v*-alpha.*']

permissions:
  contents: write

concurrency:
  group: macos-alpha-${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/macos-alpha
  RUSTFLAGS: '-C target-cpu=apple-m1'
  MACOSX_DEPLOYMENT_TARGET: '13.0'

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select alpha version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="${REQUESTED_VERSION:-${GITHUB_REF_NAME#v}}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            echo "Expected an alpha version such as 0.0.1-alpha.1" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            sequencer
            tracker/src-tauri
            stage/src-tauri
      - name: Check engine and sequencer
        run: scripts/check.sh --test
      - name: Test desktop frontends and editor extension
        env:
          NIMINAL_BIN: ${{ env.CARGO_TARGET_DIR }}/debug/niminal
          NIMINAL_LIVE_BIN: ${{ env.CARGO_TARGET_DIR }}/debug/niminal-live
        run: |
          for app in tracker stage editors/vscode; do
            (cd "$app" && npm ci && npm test)
          done
      - name: Test desktop Rust backends
        run: |
          cargo test --locked --manifest-path tracker/src-tauri/Cargo.toml
          cargo test --locked --manifest-path stage/src-tauri/Cargo.toml
      - name: Build and verify the download
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/package-macos.py "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: niminal-macos-arm64
          path: |
            releases/*.dmg
            releases/*.sha256
          if-no-files-found: error
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$RELEASE_VERSION" \
            "releases/Niminal-$RELEASE_VERSION-macos-arm64.dmg" \
            "releases/Niminal-$RELEASE_VERSION-macos-arm64.dmg.sha256" \
            --target "$GITHUB_SHA" \
            --title "Niminal $RELEASE_VERSION" \
            --prerelease \
            --notes-file scripts/macos-release-notes.md
