name: ci
on:
  push:
  pull_request:

# a newer push supersedes the run in flight
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The repo builds for the machine it is on (.cargo/config.toml). Runners differ, and a cached build tool made on
  # one can crash with an illegal instruction on another, so CI builds for a plain x86-64 instead.
  RUSTFLAGS: -C target-cpu=x86-64-v2

jobs:
  # One workspace: the engine, the language, the sequencer, the command line. Stage and the extension are
  # checked by the macOS package workflow, which has the desktop toolchain. This job runs on x86-64 Linux and
  # the `apps` job on Apple Silicon, so both CPUs the kernel JIT generates code for already run every test
  # through generated code; the `jit` job below adds the other operating systems and CPUs.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # the audio library needs the ALSA headers on Linux
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Stage (clippy, cargo test, tsc, vitest) and the extension's tests, which the Linux job cannot build. This is what
  # `scripts/check.sh --test --apps` runs locally, so a broken window or extension fails on the push, not at release.
  apps:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RUSTFLAGS: -C target-cpu=apple-m1
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      NIMINAL_BIN: ${{ github.workspace }}/target/debug/niminal
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            stage/src-tauri
      - run: |
          for app in stage editors/vscode; do
            (cd "$app" && npm ci)
          done
      - run: scripts/check.sh --test --apps

  # The kernel JIT writes machine code for aarch64 and x86-64, so a mistake in it only shows on the CPU and
  # operating system it was made for (calling convention, executable memory, instruction support). Run the engine
  # and language suites, which fuzz it against the interpreter and run every std instrument through generated code,
  # on the combinations the jobs above do not cover. The JIT tests fail if the generator cannot produce code
  # here, so a machine that quietly fell back to the interpreter cannot pass.
  jit:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04-arm, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # none of the repo's build-for-this-machine flags: these runners are different CPUs from the ones above
      RUSTFLAGS: ''
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p niminal-engine -p niminal-lang
