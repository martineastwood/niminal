name: C++ checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpp-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build and analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ libssl-dev clang-format-20 clang-tidy-20
          # Ubuntu's default clang 18 cannot parse libstdc++'s <expected>, so
          # clang-tidy rejects every C++23 source. Use clang 20 and expose the
          # unversioned names that ./dev looks up.
          for tool in clang-format clang-tidy run-clang-tidy; do
            sudo ln -sf "/usr/bin/${tool}-20" "/usr/local/bin/${tool}"
          done

      # clang-tidy runs as its own job, so a tidy failure does not hide the
      # build, unit test, and sanitizer results.
      - name: Run full validation
        run: ./dev check --no-tidy

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build and analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ libssl-dev clang-format-20 clang-tidy-20
          for tool in clang-format clang-tidy run-clang-tidy; do
            sudo ln -sf "/usr/bin/${tool}-20" "/usr/local/bin/${tool}"
          done

      # clang-tidy only needs the compile commands, not a built binary.
      - name: Configure
        run: ./dev configure

      - name: Run clang-tidy
        run: ./dev tidy --all
