[workspace]
resolver = "3"
members = ["crates/*"]

# A panic on the live path drops the set, so production code says why an invariant holds (`expect`) or returns an error.
# Tests may unwrap freely (clippy.toml).
[workspace.lints.clippy]
unwrap_used = "warn"

[workspace.package]
version = "0.0.1"
license = "MIT"
edition = "2024"

[profile.release]
lto = false

[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 1

# Full debuginfo made target/debug tens of GB; line tables keep backtraces readable.
[profile.dev]
debug = "line-tables-only"

# The audio code and the libraries it leans on are far too slow unoptimised to test: the audio baseline took
# over two minutes. Everything else keeps the quick unoptimised build, and a debugger can be pointed at the
# engine by lowering this temporarily.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.niminal-engine]
opt-level = 3
