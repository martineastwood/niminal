[project]
name = "niminal"
version = "0.0.1"
description = "A small example client for the niminal server"
requires-python = ">=3.10"
dependencies = ["websocket-client>=1.6"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["niminal*"]
