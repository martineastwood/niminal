[package]
name = "niminal-cli"
version.workspace = true
edition.workspace = true
description = "The niminal command line: offline rendering"

[[bin]]
name = "niminal"
path = "src/main.rs"

[dependencies]
niminal-engine = { path = "../niminal-engine" }
niminal-lang = { path = "../niminal-lang" }
niminal-score = { path = "../niminal-score" }
clap = { version = "4", features = ["derive"] }
hound = "3"
niminal-daemon = { path = "../niminal-daemon" }
niminal-lsp = { path = "../niminal-lsp" }
cpal = "0.18"
tungstenite = "0.30"
serde_json = "1"
rtrb = "0.3"
midir = "0.11"
