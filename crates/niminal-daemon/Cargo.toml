[package]
name = "niminal-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The niminal sound server: generic timestamped events and DSP definitions"

[dependencies]
niminal-engine = { path = "../niminal-engine" }
niminal-lang = { path = "../niminal-lang" }
niminal-score = { path = "../niminal-score" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rtrb = "0.3"
hound = "3"
