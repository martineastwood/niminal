name: C++ checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpp-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-cpp
        with:
          build-directory: build/release

      - name: Run formatting, release build, and unit tests
        run: ./dev check --no-tidy --no-sanitizer

  sanitizer:
    name: ASan and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-cpp
        with:
          build-directory: build/asan

      - name: Run sanitizer build and tests
        run: ./dev sanitizer

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-cpp
        with:
          build-directory: build/dev

      # clang-tidy only needs the compile commands, not a built binary.
      - name: Configure
        run: ./dev configure

      - name: Run clang-tidy
        run: ./dev tidy --all
