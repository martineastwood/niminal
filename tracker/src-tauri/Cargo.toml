[package]
name = "niminal-tracker"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "A tracker and instrument editor for niminal"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
midir = "0.11"
tauri = { version = "2", features = [] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
niminal-ws = { path = "../../crates/niminal-ws" }
niminal-lang = { path = "../../crates/niminal-lang" }
rfd = "0.17"
hound = "3"
niminal-compose = { path = "../../sequencer/compose" }
niminal-lsp = { path = "../../sequencer/lsp" }

[profile.dev]
debug = "line-tables-only"

[dev-dependencies]
niminal-server = { path = "../../crates/niminal-server" }
