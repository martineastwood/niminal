name: macOS alpha package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Alpha version (for example 0.0.1-alpha.1)'
        required: true
        type: string
  push:
    tags: ['v*-alpha.*']

permissions:
  contents: read

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/macos-alpha
  RUSTFLAGS: '-C target-cpu=apple-m1'
  MACOSX_DEPLOYMENT_TARGET: '13.0'

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            sequencer
            tracker/src-tauri
            stage/src-tauri
      - name: Check engine and sequencer
        run: scripts/check.sh --test
      - name: Test desktop frontends and editor extension
        run: |
          for app in tracker stage editors/vscode; do
            (cd "$app" && npm ci && npm test)
          done
      - name: Test desktop Rust backends
        run: |
          cargo test --locked --manifest-path tracker/src-tauri/Cargo.toml
          cargo test --locked --manifest-path stage/src-tauri/Cargo.toml
      - name: Build and verify the download
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$REQUESTED_VERSION" ]; then
            version="$REQUESTED_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          python3 scripts/package-macos.py "$version"
      # Review these artifacts before manually attaching them to a GitHub prerelease.
      - uses: actions/upload-artifact@v4
        with:
          name: niminal-macos-arm64
          path: |
            releases/*.zip
            releases/*.sha256
          if-no-files-found: error
