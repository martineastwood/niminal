# The sequencer: clips, scenes, patterns and a live-coding session, built as a client of the
# niminal engine. It depends on the engine's crates; nothing in `../crates` depends on this.
[workspace]
resolver = "3"
members = ["pattern", "compose", "live", "lsp", "live-cli"]

[workspace.package]
version = "0.0.1"
license = "MIT"
edition = "2024"

# Full debuginfo made target/debug tens of GB; line tables keep backtraces readable.
[profile.dev]
debug = "line-tables-only"
