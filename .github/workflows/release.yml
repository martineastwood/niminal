name: Release binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64
          - os: macos-15
            platform: macos
            arch: arm64
          - os: macos-15-intel
            platform: macos
            arch: x86_64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends cmake g++ libssl-dev zlib1g-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install openssl@3

      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure macOS
        if: runner.os == 'macOS'
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0

      - name: Build binary
        run: cmake --build build --target niminal_cli --parallel

      - name: Package binary
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          bundle="niminal-${PLATFORM}-${ARCH}"
          mkdir -p "dist/${bundle}"
          cp build/niminal "dist/${bundle}/niminal"
          tar -C dist -czf "dist/${bundle}.tar.gz" "${bundle}"
          shasum -a 256 "dist/${bundle}.tar.gz" > "dist/${bundle}.tar.gz.sha256"

          if [[ "$RUNNER_OS" == "Linux" ]]; then
            ldd build/niminal
          else
            otool -L build/niminal
          fi

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: niminal-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          pattern: niminal-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
