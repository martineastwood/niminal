name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # the audio library needs the ALSA headers on Linux
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # the sequencer is a client of the sound server above and has its own workspace
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: sequencer
      - run: cargo test
        working-directory: sequencer

  # The engine has no OS-specific code, so it must always build for the browser.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build -p niminal-engine --target wasm32-unknown-unknown
