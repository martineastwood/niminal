[package]
name = "niminal-live"
version.workspace = true
edition.workspace = true
description = "The niminal live sequencer: clips, scenes, quantized changes and keyboards, driving the engine through its public event API"

[dependencies]
niminal-ws = { path = "../../crates/niminal-ws" }
niminal-pattern = { path = "../pattern" }
niminal-engine = { path = "../../crates/niminal-engine" }
niminal-lang = { path = "../../crates/niminal-lang" }
niminal-compose = { path = "../compose" }
niminal-score = { path = "../../crates/niminal-score" }
niminal-daemon = { path = "../../crates/niminal-daemon" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
hound = "3"
rtrb = "0.3"
