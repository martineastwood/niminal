[package]
name = "niminal-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The niminal command: the engine as a server, offline rendering, and the language server"

[[bin]]
name = "niminal"
path = "src/main.rs"

[lints]
workspace = true

# Native code for kernels (aarch64 and x86-64; elsewhere it builds and does nothing). Off by default:
# `scripts/dogfood.sh` turns it on, and `NIMINAL_JIT=0` switches it off again at run time.
[features]
jit = ["niminal-engine/jit-dynasm"]

[dependencies]
niminal-sequencer = { path = "../niminal-sequencer" }
niminal-host = { path = "../niminal-host" }
niminal-lsp = { path = "../niminal-lsp" }
niminal-ws = { path = "../niminal-ws" }
niminal-engine = { path = "../niminal-engine" }
niminal-lang = { path = "../niminal-lang" }
niminal-compose = { path = "../niminal-compose" }
niminal-score = { path = "../niminal-score" }
niminal-server = { path = "../niminal-server" }
clap = { version = "4", features = ["derive"] }
hound = "3"
serde_json = "1"
ctrlc = { version = "3.5.2", features = ["termination"] }

[dev-dependencies]
rtrb = "0.3"
