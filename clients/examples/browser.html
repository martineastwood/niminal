<!doctype html>
<meta charset="utf-8">
<title>Niminal browser client</title>
<h1>Niminal browser client</h1>
<p>Start <code>niminal daemon</code> and serve the repository over HTTP. Select a WAV to upload and play, or export a generated tone.</p>
<button id="connect">Connect</button>
<input id="file" type="file" accept="audio/wav">
<button id="play" disabled>Upload and play</button>
<button id="export" disabled>Export tone</button>
<pre id="status">Disconnected</pre>
<script type="module">
import { Client } from "../js/browser.mjs";
const status = document.querySelector("#status");
const client = new Client({ port: Number(new URLSearchParams(location.search).get("port") ?? 7401), onClose: () => { status.textContent = "Disconnected"; } });
const run = fn => async () => { try { await fn(); } catch (error) { status.textContent = error.message; } };
document.querySelector("#connect").onclick = run(async () => {
  await client.connect();
  status.textContent = "Connected";
  document.querySelector("#play").disabled = document.querySelector("#export").disabled = false;
});
document.querySelector("#play").onclick = run(async () => {
  const file = document.querySelector("#file").files[0];
  if (!file) throw new Error("Choose a WAV first");
  const handle = await client.uploadFile(file);
  await client.routing([
    { op: "player", id: "sample", path: handle },
    { op: "connect", id: "out", from: { kind: "node", id: "sample" }, to: { kind: "master" } },
  ]);
  status.textContent = "Playing uploaded WAV";
});
document.querySelector("#export").onclick = run(async () => {
  const job = await client.render({ source: "instr tone() { osc(sine, 440hz) * env[0.2 | 100ms 0] }", events: [{ op: "note", target: "tone", at: 0, dur: "250ms" }], frames: 24000, tail: false });
  let result;
  do { await new Promise(resolve => setTimeout(resolve, 20)); result = await client.jobStatus(job.id); } while (result.state === "running");
  if (result.state !== "completed") throw new Error(result.error);
  const handle = result.outputs[0].file;
  const url = URL.createObjectURL(new Blob([await client.downloadFile(handle)], { type: "audio/wav" }));
  const link = document.createElement("a"); link.href = url; link.download = "niminal-export.wav"; link.textContent = "Download rendered WAV";
  status.replaceChildren(link);
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  await client.removeFile(handle);
});
</script>
